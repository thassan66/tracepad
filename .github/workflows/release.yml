name: Release

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Publish the current package version to npm"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Validate
        run: npm run verify

      - name: Package browser extension
        run: npm run extension:package

      - name: Pack npm package
        run: |
          mkdir -p dist
          npm pack --pack-destination dist

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tracepad-release-artifacts
          path: |
            dist/*.tgz
            dist/*.zip
          if-no-files-found: error

      - name: Attach artifacts to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tgz
            dist/*.zip

      - name: Publish to npm
        if: github.event_name == 'workflow_dispatch' && inputs.publish_npm == 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
